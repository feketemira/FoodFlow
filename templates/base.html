<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>FoodFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">FoodFlow</a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" href="/">Menu</a>
            <a class="btn btn-outline-light btn-sm" href="/admin/orders">Orders</a>
            <a class="btn btn-outline-light btn-sm" href="/admin/dashboard">Dashboard</a>
            <a class="btn btn-outline-light btn-sm" href="/admin/logs">Logs</a>
        </div>
    </div>
</nav>

<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

</body>
</html>
